# ============================================================
# 开发环境配置：本机单机，MySQL/Redis/RabbitMQ 都在 localhost
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cfeed?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 消费者手动 ack 模式由代码控制；消息被拒绝且不重新入队时进入死信队列
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10

logging:
  level:
    # 开发环境打开 debug 日志，方便排查
    com.feed: debug
